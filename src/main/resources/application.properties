spring.application.name=TransitDues

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.mvc.format.date=iso

spring.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@localhost:27017/transitdues?authSource=admin
spring.data.mongodb.auto-index-creation=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.roles.admin-emails=${OAUTH_ADMIN_EMAILS:}
app.roles.finance-emails=${OAUTH_FINANCE_EMAILS:}

app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.finance-email=${SEED_FINANCE_EMAIL:}
app.seed.finance-password=${SEED_FINANCE_PASSWORD:}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}