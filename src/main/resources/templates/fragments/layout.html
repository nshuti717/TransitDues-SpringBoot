<span class="text-label-md font-label-md">Operators</span>
</a>
<a class="rounded-lg font-medium px-space-md py-space-sm flex items-center gap-space-sm active:scale-[0.99] transition-colors duration-150"

   th:classappend="${activeNav == 'duepayments'} ? 'bg-primary text-on-primary' : 'text-inverse-on-surface/70 hover:text-inverse-on-surface hover:bg-surface-variant/10'"

</div>

<div th:replace="${content}"></div>
</main>
</div>
<script th:inline="none">
    (function () {
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');
        var toggle = document.getElementById('sidebar-toggle');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.add('translate-x-0');
            overlay.classList.remove('hidden');
            toggle.setAttribute('aria-expanded', 'true');
        }

        function closeSidebar() {
            sidebar.classList.remove('translate-x-0');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
            toggle.setAttribute('aria-expanded', 'false');
        }

        toggle.addEventListener('click', function () {
            if (overlay.classList.contains('hidden')) {
                openSidebar();
            } else {
                closeSidebar();
            }
        });
        overlay.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeSidebar();
            }
        });
        sidebar.querySelectorAll('a').forEach(function (link) {
            link.addEventListener('click', closeSidebar);
        });
    })();
</script>
