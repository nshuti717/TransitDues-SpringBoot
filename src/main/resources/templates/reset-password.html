<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - TransitDues</title>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131c2a'/%3E%3Ctext x='16' y='22' font-family='Arial, sans-serif' font-size='14' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ETD%3C/text%3E%3C/svg%3E" rel="icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: { extend: {
        "colors": { "on-primary": "#ffffff", "on-surface": "#131c2a", "inverse-surface": "#283140",
          "inverse-on-surface": "#ebf1ff", "primary": "#0650cc", "error": "#ba1a1a",
          "surface-container-lowest": "#ffffff", "outline-variant": "#c3c6d6", "outline": "#737685",
          "on-surface-variant": "#434654", "error-container": "#ffdad6", "surface": "#f9f9ff",
          "secondary": "#535e7b", "primary-container": "#356ae6", "tertiary": "#00655b",
          "tertiary-container": "#008074" },
        "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem" },
        "spacing": { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem" },
        "fontFamily": { "headline-lg": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"] },
        "fontSize": {
          "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
          "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
          "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
          "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
        }
      } }
    }
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between">
<main class="flex-1 flex items-center justify-center px-space-md py-space-xl">
<div class="w-full max-w-md">
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/40 shadow-sm p-space-xl">
<div class="flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-lg bg-inverse-surface flex items-center justify-center shadow-sm mb-space-md">
<span class="font-headline-lg text-headline-lg font-bold text-inverse-on-surface tracking-tight" style="font-size:16px">TD</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Enter your reset code</h1>
<p class="font-body-sm text-body-sm text-secondary mt-space-xs mb-space-lg">
            Check your email for the 6-digit code, then choose a new password.
          </p>
</div>

<div class="mb-space-lg rounded bg-error-container/40 border border-error/30 p-space-sm flex items-start gap-space-sm" th:if="${errorMessage}">
<span class="material-symbols-outlined text-error text-[18px] mt-0.5" data-icon="error">error</span>
<div class="font-body-sm text-body-sm text-on-surface-variant leading-tight" th:text="${errorMessage}">Error.</div>
</div>

<form class="space-y-space-md" method="post" th:action="@{/reset-password}" th:object="${resetPasswordForm}">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="email">Email</label>
<input class="w-full h-10 px-space-md rounded-lg border border-outline-variant/60 bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20"
       id="email" th:field="*{email}" type="email"/>
<div class="flex items-center gap-1.5 text-error text-body-sm mt-1" th:if="${#fields.hasErrors('email')}">
<span th:errors="*{email}">Enter a valid email address.</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="otpCode">6-digit code</label>
<input class="w-full h-10 px-space-md rounded-lg border border-outline-variant/60 bg-surface-container-lowest text-on-surface font-body-md text-body-md tracking-[0.3em] focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20"
       id="otpCode" th:field="*{otpCode}" type="text" inputmode="numeric" maxlength="6" autofocus="autofocus"/>
<div class="flex items-center gap-1.5 text-error text-body-sm mt-1" th:if="${#fields.hasErrors('otpCode')}">
<span th:errors="*{otpCode}">Enter the 6-digit code.</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="newPassword">New password</label>
<input class="w-full h-10 px-space-md rounded-lg border border-outline-variant/60 bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20"
       id="newPassword" th:field="*{newPassword}" type="password"/>
<div class="flex items-center gap-1.5 text-error text-body-sm mt-1" th:if="${#fields.hasErrors('newPassword')}">
<span th:errors="*{newPassword}">Password must be at least 8 characters.</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="confirmPassword">Confirm new password</label>
<input class="w-full h-10 px-space-md rounded-lg border border-outline-variant/60 bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20"
       id="confirmPassword" th:field="*{confirmPassword}" type="password"/>
<div class="flex items-center gap-1.5 text-error text-body-sm mt-1" th:if="${#fields.hasErrors('confirmPassword')}">
<span th:errors="*{confirmPassword}">Passwords do not match.</span>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary py-2.5 px-space-md rounded-lg font-label-md text-label-md shadow-sm hover:bg-primary transition-all flex items-center justify-center gap-space-sm" type="submit">
            Reset password
          </button>
</form>

<div class="mt-space-lg text-center flex items-center justify-center gap-space-md">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="/forgot-password">Request a new code</a>
<span class="text-outline-variant">&middot;</span>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="/login">Back to sign in</a>
</div>
</div>
</div>
</main>
</body>
</html>
